# Provider overlay for init --template kimi; inherits hybrid rules and assets.
# API fields checked 2026-10-13: https://platform.kimi.ai/docs/guide/use-reasoning-effort
# Credentials are environment references. Change both model targets when needed.
upstreams:
  primary:
    kind: openai_chat
    base_url: 'https://api.moonshot.ai/v1'
    api_key_env: FAKEAPI_UPSTREAM_API_KEY
    max_concurrent: 4
    timeouts: {connect: 5s, first_event: 30s, idle: 30s, total: 120s}
    reasoning_translation: omit
targets:
  primary-fast:
    upstream: primary
    model: 'kimi-k3'
    max_tokens_parameter: max_tokens
    developer_role_fallback: system
    capabilities:
      images: false
      tools: true
      json_object: true
      json_schema: false
      developer_role: false
      parallel_tool_calls_parameter: false
    reasoning:
      mode: effort
      history: preserve
      allowed_efforts: [low, high, max]
      default_effort: high
      can_disable: false
      budget: false
  primary-quality:
    upstream: primary
    model: 'kimi-k3'
    max_tokens_parameter: max_tokens
    developer_role_fallback: system
    capabilities:
      images: false
      tools: true
      json_object: true
      json_schema: false
      developer_role: false
      parallel_tool_calls_parameter: false
    reasoning:
      mode: effort
      history: preserve
      allowed_efforts: [low, high, max]
      default_effort: high
      can_disable: false
      budget: false
